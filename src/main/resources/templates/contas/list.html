<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Securitas Cash - Minhas Contas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="mb-3 text-end" th:if="${usuarioTipo == 'Administrador'}">
            <a th:href="@{/correntistas}" class="btn btn-success">Cadastrar Novo Correntista</a>
        </div>
        <h2 class="text-dark mb-4">Minhas Contas</h2>

        <!-- Alerta: Nenhuma conta -->
        <div class="alert alert-info" role="alert" th:if="${#lists.isEmpty(contas)}">
            Você não possui contas cadastradas.
        </div>

        <!-- Alerta: Mensagem geral -->
        <div class="alert alert-info" role="alert" th:if="${mensagem}">
            [[${mensagem}]]
        </div>

        <!-- Tabela de contas -->
        <table class="table table-hover table-bordered shadow-sm bg-white" th:unless="${#lists.isEmpty(contas)}">
            <thead class="text-white text-center" style="background-color: #383636;">
                <tr>
                    <th>Descrição</th>
                    <th>Número da Conta</th>
                    <th>Tipo da Conta</th>
                    <th colspan="2">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="conta : ${contas}" class="text-center">
                    <td th:text="${conta.descricao}">Descrição</td>
                    <td th:text="${conta.numero}">0000-0</td>
                    <td th:text="${conta.tipo}">CORRENTE</td>

                    <!-- Botão Ver Transações -->
                    <td>
                        <a th:href="@{'/contas/' + ${conta.id} + '/transacoes'}" class="btn btn-outline-dark btn-sm">
                            <i class="bi bi-list-ul"></i> Transações
                        </a>
                    </td>

                    <!-- Botão Editar -->
                    <td>
                        <a th:href="@{'/contas/' + ${conta.id} + '/editar'}" class="btn btn-outline-success btn-sm">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Botão Adicionar -->
        <div class="d-flex justify-content-end mt-3">
            <a class="btn text-white" style="background-color: #6FA285;" href="/contas/criar">
                <i class="bi bi-plus-circle"></i> Adicionar Conta
            </a>
        </div>
    </div>

</body>
</html>
