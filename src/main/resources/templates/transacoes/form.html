<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Transação</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{/fragments/header}" />
<div class="container mt-5">
    <h2 class="mb-4">Nova Transação</h2>

    <form th:action="@{/contas/{id}/transacoes}" th:object="${transacaoForm}" method="post">

        <input type="hidden" name="contaId" th:value="${contaId}" />

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" class="form-control" th:field="*{descricao}" id="descricao" />
            <div th:if="${#fields.hasErrors('descricao')}" class="text-danger" th:errors="*{descricao}"  ></div>

        </div>

        <div class="mb-3">
            <label for="movimento" class="form-label">Movimento</label>
            <select th:field="*{movimento}" class="form-select">
                <option th:value="'Crédito'" th:text="Crédito"></option>
                <option th:value="'Debito'" th:text="Débito"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="Categoria" class="form-label">Categoria</label>
            <select th:field="*{categoria}" class="form-select">
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" class="form-control" th:field="*{valor}" step="0.01" id="valor" />
            <div th:if="${#fields.hasErrors('valor')}" class="text-danger" th:errors="*{valor}"  ></div>

        </div>

        <div class="mb-3">
            <label for="data" class="form-label">Data</label>
            <input type="date" class="form-control" th:field="*{data}" id="data" />
            <div th:if="${#fields.hasErrors('data')}" class="text-danger" th:errors="*{data}"  ></div>

        </div>


        <h4>Comentário</h4>

        <div class="mb-3">
            <textarea class="form-control"
                    th:field="*{comentario.texto}"
                    rows="2"
                    placeholder="Digite um comentário opcional">
            </textarea>
            <div th:if="${#fields.hasErrors('comentario.texto')}" class="text-danger" th:errors="*{comentario.texto}"  ></div>
        </div>

        <a th:href="@{'/contas/' + ${contaId} + '/transacoes'}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Salvar Transação</button>
    </form>
</div>
</body>
</html>
