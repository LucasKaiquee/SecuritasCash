<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Securitas Cash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --main-color: #6FA285;
        }

        body {
            background-color: #f8fdf9;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg-main {
            background-color: var(--main-color);
        }

        .btn-main {
            background-color: var(--main-color);
            color: white;
        }

        .btn-main:hover {
            background-color: #5b896e;
            color: white;
        }

        .description {
            color: #555;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        footer {
            font-size: 0.9rem;
            color: #aaa;
            padding-top: 2rem;
        }
    </style>
</head>
<body>

    <header class="bg-main text-white text-center py-4 shadow-sm">
        <h1 class="display-5 fw-bold">Securitas Cash</h1>
    </header>

    <main class="container text-center mt-5">
        <h2 class="mb-3">Bem-vindo ao <span th:text="${pageName}">Sistema</span></h2>
        <p class="description">
            Controle financeiro inteligente, seguro e prático.
        </p>
        <a href="usuario/login" class="btn btn-main px-4 py-2 fs-5">Entrar</a>
    </main>

    <footer class="text-center mt-5">
        &copy; 2025 Securitas Cash. Todos os direitos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
