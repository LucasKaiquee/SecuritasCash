<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Transações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="container mt-5">

<h2>Transações</h2>

<div th:each="transacao : ${transacoes}" class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h5 class="card-title" th:text="${transacao.descricao}">Descrição</h5>
        <h6 class="card-subtitle mb-2 text-muted">
          <span th:text="'Data: ' + ${#dates.format(transacao.data, 'yyyy-MM-dd')}"></span> |
          <span th:text="'Valor: R$ ' + ${transacao.valor}"></span> |
          <span th:text="'Tipo: ' + ${transacao.movimento}"></span>
        </h6>
      </div>
      <div>
        <button class="btn btn-outline-secondary me-2" title="Editar Transação">
          <i class="fas fa-edit"></i>
        </button>
        <button class="btn btn-outline-info" title="Exibir Comentários" onclick="toggleComentarios(this)">
          <i class="fas fa-comments"></i>
        </button>
      </div>
    </div>

    <div class="comentario-container mt-3 d-none" th:if="${transacao.comentarios != null}">
      <div th:each="comentario : ${transacao.comentarios}" class="d-flex justify-content-between align-items-center">
        <p class="mb-1" th:text="${comentario.texto}">Comentário</p>
        <div>
          <button class="btn btn-sm btn-outline-warning me-2" title="Editar Comentário">
            <i class="fas fa-pen"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" title="Remover Comentário">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleComentarios(button) {
    const card = button.closest('.card-body');
    const comentarios = card.querySelector('.comentario-container');
    comentarios.classList.toggle('d-none');
  }
</script>

</body>
</html>
