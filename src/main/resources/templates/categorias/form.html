<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Categoria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{/fragments/header}" />
<div class="container mt-5">
    <h2 class="mb-4">Nova Categoria</h2>

    <form th:action="@{/categorias}" th:object="${categoriaForm}" method="post">

        <!-- <input type="hidden" name="contaId" th:value="${contaId}" /> -->

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" id="descricao" />
            <div th:if="${#fields.hasErrors('nome')}" class="text-danger" th:errors="*{nome}"  ></div>

        </div>

        <div class="mb-3">
            <label for="Natureza" class="form-label">Natureza</label>
            <select th:field="*{natureza}" class="form-select">
                <option th:each="natureza : ${naturezas}" th:value="${natureza}" th:text="${natureza.displayValue}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="ativo" class="form-label">Ativa</label>
            <input type="checkbox" th:checked="${categoriaForm.ativo}" class="form-check" th:field="*{ativo}"  id="ativo" />
            <div th:if="${#fields.hasErrors('ativo')}" class="text-danger" th:errors="*{ativo}"  ></div>

        </div>

        <div class="mb-3">
            <label for="ordem" class="form-label">Ordem</label>
            <input type="number" class="form-control" th:field="*{ordem}" id="ordem" />
            <div th:if="${#fields.hasErrors('ordem')}" class="text-danger" th:errors="*{ordem}"  ></div>
        </div>

        <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Salvar Categoria</button>
    </form>
</div>
</body>
</html>
