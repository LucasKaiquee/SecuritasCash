<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title>Cadastro de Categoria</title>
    </head>
<body>
<section layout:decorate="~{layouts/layout}" layout:fragment="content">
    <div class="container mt-5">

        <div th:if="${categoria}">
            <h2 class="mb-4">Editar Categoria</h2>
        </div>

        <div th:unless="${categoria}">
            <h2 class="mb-4">Nova Categoria</h2>
        </div>


        <!-- Cadastro de nova Categoria -->
        <div th:unless="${categoria}">
            <form th:action="@{/categorias}" th:object="${categoriaForm}" method="post">

                <!-- <input type="hidden" name="contaId" th:value="${contaId}" /> -->

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" th:field="*{nome}" />
                    <div th:if="${#fields.hasErrors('nome')}" class="text-danger" th:errors="*{nome}"></div>
                </div>

                <div class="mb-3">
                    <label for="Natureza" class="form-label">Natureza</label>
                    <select th:field="*{natureza}" class="form-select">
                        <option th:each="natureza : ${naturezas}" th:value="${natureza}"
                            th:text="${natureza.displayValue}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="ativo" class="form-label">Ativa</label>
                    <input type="checkbox" th:checked="${categoriaForm.ativo}" class="form-check" th:field="*{ativo}"
                        id="ativo" />
                    <div th:if="${#fields.hasErrors('ativo')}" class="text-danger" th:errors="*{ativo}"></div>
                </div>

                <div class="mb-3">
                    <label for="ordem" class="form-label">Ordem</label>
                    <input type="number" class="form-control" th:field="*{ordem}" id="ordem" />
                    <div th:if="${#fields.hasErrors('ordem')}" class="text-danger" th:errors="*{ordem}"></div>
                </div>

                <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Salvar Categoria</button>
            </form>
        </div>

        <!-- Edição de Categoria existente -->
        <div th:if="${categoria}">
            <form th:action="@{'/categorias/' + ${categoria.id}}" th:object="${categoria}" method="post">
                <input type="hidden" name="_method" value="put" />

                <div class="mb-3">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{name}" />
                </div>

                <div class="mb-3">
                    <label for="natureza" class="form-label">Natureza</label>
                    <select class="form-select" th:field="*{natureza}">
                        <option th:each="n : ${naturezas}" th:value="${n}" th:text="${n.displayValue}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="isActive" class="form-label">Ativa</label>
                    <input type="checkbox" class="form-check-input" th:field="*{isActive}" />
                </div>

                <div class="mb-3">
                    <label for="ordem" class="form-label">Ordem</label>
                    <input type="number" class="form-control" th:field="*{ordem}" />
                </div>

                <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
            </form>
        </div>

    </div>
</section>
</body>
</html>
