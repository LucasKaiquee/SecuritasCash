<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Categorias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/categorias/list.css">

</head>

<body>
    <div th:replace="~{/fragments/header}" />

    <div class="container mt-5">
        <h2 class="mb-4">Categorias</h2>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Filtrar por:</h5>
                <form th:action="@{/categorias}" method="get" class="filter-form">
                    <div class="row align-items-end">
                        <div class="col-lg-3 col-md-6 mb-3">
                            <label for="Natureza" class="form-label">Natureza</label>
                            <select  class="form-select">
                                <option th:value="Todos" th:text="Todos"></option>
                                <option th:each="natureza : ${naturezas}" th:value="${natureza}" th:text="${natureza.displayValue}"></option>
                            </select>
                        </div>

                        <div class="col-lg-3 col-md-6 mb-3">
                            <label for="filtroOrdem" class="form-label">Ordem</label>
                            <select id="filtroOrdem" name="ativo" class="form-select">
                                <option value="x">Crescente</option>
                                <option value="y">Decrescente</option>
                            </select>
                        </div>

                        <div class="col-lg-3 col-md-6 mb-3">
                            <label for="filtroAtivo" class="form-label">Ativo</label>
                            <select id="filtroAtivo" name="ativo" class="form-select">
                                <option value="">Todos</option>
                                <option value="true">Sim</option>
                                <option value="false">Não</option>
                            </select>
                        </div>

                        <div class="col-lg-3 col-md-6 mb-3 d-flex align-items-center">
                            <button type="submit" class="btn btn-primary me-2"> 
                                <i class="bi bi-funnel"></i> Filtrar
                            </button>
                            <a th:href="@{/categorias}" class="btn btn-secondary">
                                <i class="bi bi-arrow-clockwise"></i> Limpar
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div th:if="${mensagem}" class="alert alert-success" role="alert">
            <p th:text="${mensagem}"></p>
        </div>

        <div class="scroll-table">
            <table class="styled-table">
                <thead class="table-dark text-center" >
                    <tr>
                        <th>Nome</th>
                        <th>Natureza</th>
                        <th>Ordem</th>
                        <th>Ativo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="categoria : ${categorias}" class="active-row">
                        <td th:text="${categoria.name}">Nome</td>
                        <td th:text="${categoria.natureza.displayValue}">Investimento</td>
                        <td th:text="${categoria.ordem}">1</td>
                        <td th:text="${categoria.isActive ? 'Sim' : 'Não'}">1</td>
                        <td>
                            <!-- Botão Excluir -->
                            <form method="post">
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir"
                                        onclick="return confirm('Tem certeza que deseja excluir esta categoria?');">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <a class="btn text-white" style="background-color: #6FA285;" th:href="@{'/categorias/criar'}">
                <i class="bi bi-plus-circle"></i> Adicionar Categoria
            </a>
        </div>
    </div>
</body>

</html>
