<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Categorias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/categorias/list.css">

</head>

<body>
    <div th:replace="~{/fragments/header}" />

    <div class="container mt-5">
        <h2 class="mb-4">Categorias</h2>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Filtrar por:</h5>
                <form th:action="@{/categorias}" method="get" class="filter-form">
                    <div class="row align-items-end">
                        <div class="col-12 col-md-6 col-lg-3 mb-3">
                            <label for="natureza" class="form-label">Natureza</label>
                            <select id="natureza" name="natureza" class="form-select">
                                <option value="">Todos</option>
                                <option 
                                    th:each="n : ${naturezas}" 
                                    th:value="${n}" 
                                    th:text="${n.displayValue}"
                                    th:selected="${ n == naturezaSelecionada}"
                                    ></option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6 col-lg-3 mb-3">
                            <label for="filtroAtivo" class="form-label">Ativo</label>
                            <select id="filtroAtivo" th:name="isActive" class="form-select">
                                <option value="" th:selected="${ativoSelecionado == null}">Todos</option>
                                <option value="true" th:selected="${ativoSelecionado != null and ativoSelecionado == true}">Sim</option>
                                <option value="false" th:selected="${ativoSelecionado != null and ativoSelecionado == false}">Não</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6 col-lg-3 mb-3">
                            <label for="filtroOrdem" class="form-label">Ordem</label>
                            <select id="filtroOrdem" name="sort" class="form-select">
                                <option value="">Nenhuma</option>
                                <option value="name,asc" th:selected="${param.sort != null and param.sort[0] == 'name,asc'}">Nome Crescente (A-Z)</option>
                                <option value="name,desc" th:selected="${param.sort != null and param.sort[0] == 'name,desc'}">Nome Decrescente (Z-A)</option>
                                <option value="ordem,asc" th:selected="${param.sort != null and param.sort[0] == 'ordem,asc'}">Ordem Crescente</option>
                                <option value="ordem,desc" th:selected="${param.sort != null and param.sort[0] == 'ordem,desc'}">Ordem Decrescente</option>
                            </select>
                        </div>

                        <div class="col-lg-3 col-md-6 mb-3 d-flex align-items-center">
                            <button type="submit" class="btn btn-primary me-2"> 
                                <i class="bi bi-funnel"></i> Filtrar
                            </button>
                            <a th:href="@{/categorias}" class="btn btn-secondary">
                                <i class="bi bi-arrow-clockwise"></i> Limpar
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div th:if="${mensagem}" class="alert alert-success" role="alert">
            <p th:text="${mensagem}"></p>
        </div>

        <div class="text-muted mb-2" th:if="${!pagina.empty}">
            Mostrando registros de
            <strong th:text="${(pagina.number * pagina.size) + 1}">1</strong>
            a
            <strong th:text="${(pagina.number * pagina.size) + pagina.numberOfElements}">10</strong>
            de um total de
            <strong th:text="${pagina.totalElements}">57</strong>.
        </div>

        <div class="scroll-table">
            <table class="styled-table" id="categoriesTable">
                <thead class="table-dark text-center">
                    <tr>
                        <th>Nome</th>
                        <th>Natureza</th>
                        <th>Ordem</th>
                        <th>Ativo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="categoria : ${pagina.content}" class="active-row">
                        <td>
                            <span class="category-name-text" th:text="${categoria.name}">Nome</span>
                            <a class="category-name-link"
                            th:href="@{/categorias/editar/{id}(id=${categoria.id})}"
                            th:attr="data-delete-url=@{/categorias/excluir/{id}(id=${categoria.id})}"
                            th:text="${categoria.name}">
                            </a>
                        </td>
                        <td th:text="${categoria.natureza.displayValue}">Todos</td>
                        <td th:text="${categoria.ordem}">1</td>
                        <td th:text="${categoria.isActive ? 'Sim' : 'Não'}">Sim</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-center mt-3">
            <nav aria-label="Navegação da página">
                <ul class="pagination">

                    <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                        <a class="page-link"
                        th:href="@{/categorias(page=${pagina.number - 1},
                                                size=${pagina.size},
                                                sort=${param.sort ?: ''},
                                                natureza=${param.natureza},
                                                ativo=${param.ativo})}"
                        aria-label="Anterior">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <li class="page-item disabled">
                        <a class="page-link" href="#" tabindex="-1" aria-disabled="true">
                            Página <span th:text="${pagina.number + 1}"></span> de <span th:text="${pagina.totalPages} == 0 ? '1' : ${pagina.totalPages}"></span>
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                        <a class="page-link"
                        th:href="@{/categorias(page=${pagina.number + 1},
                                                size=${pagina.size},
                                                sort=${param.sort ?: ''},
                                                natureza=${param.natureza},
                                                ativo=${param.ativo})}"
                        aria-label="Próximo">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button type="button" id="toggleDeleteModeBtn" class="btn text-white me-2 mode-btn">
                <i class="bi bi-trash"></i> Excluir
            </button>
            <button type="button" id="toggleEditModeBtn" class="btn text-white me-2 mode-btn">
                <i class="bi bi-pencil"></i> Editar
            </button>
            <a class="btn text-white" style="background-color: #6FA285;" th:href="@{'/categorias/criar'}">
                <i class="bi bi-plus-circle"></i> Adicionar
            </a>
        </div>
        
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const categoriesTable = document.getElementById('categoriesTable');
        const toggleEditBtn = document.getElementById('toggleEditModeBtn');
        const toggleDeleteBtn = document.getElementById('toggleDeleteModeBtn');

        // --- Lógica para alternar os modos (garantindo que apenas um fique ativo) ---
        toggleEditBtn.addEventListener('click', function() {
            // Desativa o modo de exclusão se estiver ativo
            categoriesTable.classList.remove('delete-mode-on');
            toggleDeleteBtn.classList.remove('delete-mode-active');
            // Alterna o modo de edição
            this.classList.toggle('edit-mode-active');
            categoriesTable.classList.toggle('edit-mode-on');
        });

        toggleDeleteBtn.addEventListener('click', function() {
            // Desativa o modo de edição se estiver ativo
            categoriesTable.classList.remove('edit-mode-on');
            toggleEditBtn.classList.remove('edit-mode-active');
            // Alterna o modo de exclusão
            this.classList.toggle('delete-mode-active');
            categoriesTable.classList.toggle('delete-mode-on');
        });

        // --- Lógica Central para o Clique no Nome da Categoria ---
        categoriesTable.addEventListener('click', function(event) {
            // Verifica se o elemento clicado é um link de categoria dentro da tabela
            if (event.target.matches('.category-name-link')) {
                // Previne a ação padrão do link (navegar para o href)
                event.preventDefault();

                const link = event.target;

                // Se a tabela estiver em MODO DE EXCLUSÃO...
                if (categoriesTable.classList.contains('delete-mode-on')) {
                    const deleteUrl = link.getAttribute('data-delete-url');
                    const confirmed = confirm('Tem certeza que deseja excluir esta categoria? A ação não pode ser desfeita.');

                    if (confirmed) {
                        // Chama a função que cria e submete o formulário seguro
                        submitDeleteForm(deleteUrl);
                    }
                }
                // Se a tabela estiver em MODO DE EDIÇÃO...
                else if (categoriesTable.classList.contains('edit-mode-on')) {
                    // ...permite a navegação para o href do link (página de edição)
                    window.location.href = link.href;
                }
                // Se nenhum modo estiver ativo, nada acontece.
            }
        });

        function submitDeleteForm(url) {
            const form = document.createElement('form');
            form.method = 'post';
            form.action = url;

            const hiddenField = document.createElement('input');
            hiddenField.type = 'hidden';
            hiddenField.name = '_method';
            hiddenField.value = 'delete';

            form.appendChild(hiddenField);
            document.body.appendChild(form);
            form.submit();
        }
    });
    </script>
</body>

</html>
