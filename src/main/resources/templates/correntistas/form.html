<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">

<head>
    <title th:text="${correntista} ? 'Editar Correntista' : 'Cadastrar Correntista' ">Correntistas</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container">

            <div th:if="${correntista}">
                <h2 class="mb-4">Editar Correntista</h2>
            </div>

            <div th:unless="${correntista}">
                <h2 class="mb-4">Cadastro de Correntista</h2>
            </div>

            <!-- Cadastro de Correntista -->
            <div th:unless="${correntista}">
                <form th:action="@{/correntistas/novo}" th:object="${correntistaForm}" method="post">

                    <!-- <input type="hidden" th:field="*{id}" /> -->

                    <!-- <input type="hidden" th:field="*{contas}" /> -->

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" th:field="*{nome}" class="form-control" id="nome"
                            placeholder="Digite o nome">
                        <div th:if="${#fields.hasErrors('nome')}" class="text-danger" th:errors="*{nome}"></div>

                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" th:field="*{email}" class="form-control" id="email"
                            placeholder="Digite o e-mail">
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" th:field="*{senha}" class="form-control" id="senha"
                            placeholder="Digite a senha">
                        <div th:if="${#fields.hasErrors('senha')}" class="text-danger" th:errors="*{senha}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="blocked" class="form-label">Bloquado?</label>
                        <input type="checkbox" th:checked="${correntistaForm.blocked}" class="form-check"
                            th:field="*{blocked}" id="blocked" />
                        <div th:if="${#fields.hasErrors('blocked')}" class="text-danger" th:errors="*{blocked}"></div>
                    </div>

                    <button type="submit" class="btn btn-success">Cadastrar</button>
                    <a href="/correntistas" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>

            <!-- Edição Correntista -->
            <div th:if="${correntista}">
                
                <form th:action="@{'/correntistas/editar/' + ${correntista.id}}" th:object="${correntista}" method="post">

                    <input type="hidden" name="_method" value="put">

                    <!-- <input type="hidden" th:field="*{id}" /> -->

                    <!-- <input type="hidden" th:field="*{contas}" /> -->

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" th:field="*{nome}" class="form-control" id="nome"
                            placeholder="Digite o nome">
                        <div th:if="${#fields.hasErrors('nome')}" class="text-danger" th:errors="*{nome}"></div>

                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" th:field="*{email}" class="form-control" id="email"
                            placeholder="Digite o e-mail">
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
                    </div>

                    <!-- <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" th:field="*{senha}" class="form-control" id="senha"
                            placeholder="Digite a senha">
                        <div th:if="${#fields.hasErrors('senha')}" class="text-danger" th:errors="*{senha}"></div>
                    </div> -->

                    <div class="mb-3">
                        <label for="blocked" class="form-label">Bloquado?</label>
                        <input type="checkbox" th:checked="${correntista.blocked}" class="form-check"
                            th:field="*{blocked}" id="blocked" />
                        <div th:if="${#fields.hasErrors('blocked')}" class="text-danger" th:errors="*{blocked}"></div>
                    </div>

                    <button type="submit" class="btn btn-success">Salvar</button>
                    <a href="/correntistas" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>

        </div>
    </section>
</body>

</html>
