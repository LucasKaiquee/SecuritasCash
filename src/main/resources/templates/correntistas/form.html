<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Correntista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Cadastro de Correntista</h2>

    <form th:action="@{/correntistas/novo}" th:object="${correntista}" method="post">
        
        <input type="hidden" th:field="*{id}" />

        <input type="hidden" th:field="*{contas}" />

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="Digite o nome" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="Digite o e-mail" required>
        </div>

        <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" th:field="*{senha}" class="form-control" id="senha" placeholder="Digite a senha" required>
        </div>

        <button type="submit" class="btn btn-success">Cadastrar</button>
        <a href="/correntistas" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
