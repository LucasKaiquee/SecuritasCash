<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Correntistas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div th:replace="~{/fragments/header}" />
    <div class="container mt-5">
        <h2 class="mb-4">Correntistas Cadastrados</h2>
        <div th:if="${mensagem}" class="alert alert-success" role="alert">
            <p th:text="${mensagem}"></p>
        </div>
        <table class="table table-bordered table-striped">
            <thead class="table-dark text-center" >
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="correntista : ${correntistas}" class="text-center">
                    <td th:text="${correntista.id}">1</td>
                    <td th:text="${correntista.nome}">Nome</td>
                    <td th:text="${correntista.email}">email@exemplo.com</td>
                    <td th:text="${correntista.isBlocked ? 'Bloqueado' : 'Ativo'}">Ativo</td>
                </tr>
            </tbody>
        </table>
        <div class="d-flex justify-content-end mt-3">
            <a class="btn text-white" style="background-color: #6FA285;" th:href="@{'/correntistas/novo'}">
                <i class="bi bi-plus-circle"></i> Adicionar Correntista
            </a>
        </div>

        
    </div>
</body>

</html>
